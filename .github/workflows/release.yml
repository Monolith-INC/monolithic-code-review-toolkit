name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository invariants
        run: python scripts/validate_plugin.py .

      - name: Run repository tests
        run: python -m unittest discover -s tests -t .
      - name: Run Codex adapter tests
        run: python -m unittest discover -s adapters/codex/tests -t .
      - name: Run Claude adapter tests
        run: python -m unittest discover -s adapters/claude/tests -t .

      - name: Validate portable plugin root
        run: bash scripts/with_toolkit.sh validate plugins/monolithic-code-review-toolkit

      - name: Compile vendor payloads
        run: node scripts/build_payloads.mjs build

      - name: Check compilation is deterministic
        run: node scripts/build_payloads.mjs verify

      # Each vendor payload is installed host-natively, so ship one archive per
      # host rather than a single bundle.
      - name: Package payloads
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for vendor in claude cursor codex; do
            tar -czf "dist/monolithic-code-review-toolkit-${VERSION}-${vendor}.tar.gz" \
              -C "payloads/${vendor}" payload bundle.json
          done
          # --exclude: the test steps above import these modules, so __pycache__
          # exists by now. tar does not honour .gitignore, and shipping one
          # runner's bytecode helps nobody.
          #
          # core/ ships with each adapter: both import core.review_harness, and a
          # hook that cannot import it exits 1, which both hosts treat as a
          # non-blocking hook error — every guarded write would be permitted.
          tar --exclude='__pycache__' \
            -czf "dist/monolithic-code-review-toolkit-${VERSION}-codex-review-orchestrator.tar.gz" \
            adapters/codex \
            core
          tar --exclude='__pycache__' \
            -czf "dist/monolithic-code-review-toolkit-${VERSION}-claude-review-orchestrator.tar.gz" \
            adapters/claude \
            core
          ls -la dist

      # Release notes are this version's changelog section only — passing the
      # whole file would republish every previous release's notes each time.
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found && /^\[[^]]+\]: / { exit }
            found                  { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac > dist/NOTES.md
          if [ ! -s dist/NOTES.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          cat dist/NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/NOTES.md \
            dist/*.tar.gz
