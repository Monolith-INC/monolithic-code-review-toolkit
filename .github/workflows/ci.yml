name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Repository invariants and unit tests. Fast, no toolkit checkout needed,
  # so it runs everywhere the plugin might be authored.
  checks:
    name: checks (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # `python`, not `python3`: setup-python provides `python` on both runners.
      - name: Validate repository invariants
        run: python scripts/validate_plugin.py .
      - name: Run repository tests
        run: python -m unittest discover -s tests -t . -v
      - name: Run Codex adapter tests
        run: python -m unittest discover -s adapters/codex/tests -t . -v
      - name: Run Claude adapter tests
        run: python -m unittest discover -s adapters/claude/tests -t . -v

  # Template conformance. Builds the pinned agent-plugins-toolkit and runs its
  # own validator and payload verifier against our plugin root — this is the
  # gate that proves we have not deviated from the template.
  conformance:
    name: template conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolkit checkout
        uses: actions/cache@v4
        with:
          path: .toolkit
          key: toolkit-${{ hashFiles('scripts/with_toolkit.sh') }}
      - name: Validate portable plugin root
        run: bash scripts/with_toolkit.sh validate plugins/monolithic-code-review-toolkit
      - name: Inspect portable components
        run: bash scripts/with_toolkit.sh inspect plugins/monolithic-code-review-toolkit
      # Payloads are build output, not committed state. Compiling them here is
      # the real gate: it proves every vendor adapter accepts this source.
      - name: Compile vendor payloads
        run: node scripts/build_payloads.mjs build
      - name: Check compilation is deterministic
        run: node scripts/build_payloads.mjs verify
